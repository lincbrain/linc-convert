name: Auto-release on PR merge

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write       # create the GitHub release
  pull-requests: write  # comment on and label released PRs
  issues: write         # comment on and label released issues

concurrency:
  group: release
  cancel-in-progress: false

env:
  AUTO_VERSION: v11.3.6

jobs:
  auto-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: Download auto
        run: |
          wget -O- "https://github.com/intuit/auto/releases/download/$AUTO_VERSION/auto-linux.gz" | gunzip > ~/auto
          chmod a+x ~/auto

      - name: Check whether a release is due
        id: auto-version
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]
          then opts=
          else opts=--only-publish-with-release-label
          fi
          version="$(~/auto version $opts)"
          echo "opts=$opts" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the deploy key can push
        if: steps.auto-version.outputs.version != ''
        run: git push --dry-run "git@github.com:${{ github.repository }}.git" HEAD:main

      - name: Set up Python
        if: steps.auto-version.outputs.version != ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        if: steps.auto-version.outputs.version != ''
        run: python -m pip install build==1.6.1 twine==7.0.0 poetry-core==1.9.1 poetry-dynamic-versioning==1.10.1

      - name: Create release
        if: steps.auto-version.outputs.version != ''
        run: |
          echo "@${{ github.actor }} is creating a release triggered by ${{ github.event_name }}"
          ~/auto shipit -vv ${{ steps.auto-version.outputs.opts }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
