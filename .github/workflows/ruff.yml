name: Ruff
on:
  pull_request_target:
    branches: [master]
permissions:
  contents: write
jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v1
        with:
          args: "format"
          changed-files: "true"
      - uses: astral-sh/ruff-action@v3
        with:
          args: "check --fix"
          changed-files: "true"
      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'style: fixes by ruff'
