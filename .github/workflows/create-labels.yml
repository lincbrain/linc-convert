name: Create release labels

# Run once (and again whenever .autorc changes) to create the labels that
# auto uses to choose the version bump and the changelog section of each PR.
on:
  workflow_dispatch:

permissions:
  issues: write  # labels are managed through the issues API

jobs:
  create-labels:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download latest auto
        run: |
          auto_download_url="$(curl -fsSL https://api.github.com/repos/intuit/auto/releases/latest | jq -r '.assets[] | select(.name == "auto-linux.gz") | .browser_download_url')"
          wget -O- "$auto_download_url" | gunzip > ~/auto
          chmod a+x ~/auto

      - name: Create labels
        run: ~/auto create-labels -vv
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
