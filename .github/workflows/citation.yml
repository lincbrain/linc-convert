name: Validate CITATION.cff

on:
  pull_request:
    paths:
      - CITATION.cff
      - .github/workflows/citation.yml
  push:
    branches:
      - main
    paths:
      - CITATION.cff
      - .github/workflows/citation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install cffconvert
        run: python -m pip install cffconvert==2.0.0

      - name: Validate CITATION.cff
        run: cffconvert --validate --infile CITATION.cff
